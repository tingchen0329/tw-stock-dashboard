<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股研究台</title>
<meta name="description" content="個人台股研究儀表板：全市場搜尋、追蹤清單、技術指標、本益比河流圖、月營收與籌碼。">
<!--
  內容安全政策 (CSP)：只允許本站的腳本 / 樣式，以及連到 FinMind API。
  即使未來有人塞入惡意的股票名稱，也無法執行外部或行內腳本。
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.finmindtrade.com https://*.vercel.app; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="assets/css/app.css">
<!-- modulepreload：讓瀏覽器一開始就平行下載所有模組，不必等 main.js 解析完才發現依賴 -->
<link rel="modulepreload" href="assets/js/main.js">
<link rel="modulepreload" href="assets/js/data.js">
<link rel="modulepreload" href="assets/js/net.js">
<link rel="modulepreload" href="assets/js/format.js">
<link rel="modulepreload" href="assets/js/search.js">
<link rel="modulepreload" href="assets/js/analytics.js">
<link rel="modulepreload" href="assets/js/render.js">
<link rel="modulepreload" href="assets/js/charts.js">
<link rel="modulepreload" href="assets/js/prompt.js">
<link rel="modulepreload" href="assets/js/market.js">
<link rel="modulepreload" href="assets/js/overview.js">
<link rel="modulepreload" href="assets/js/screen.js">
<link rel="modulepreload" href="assets/js/ai.js">
<link rel="modulepreload" href="assets/js/export.js">
<script type="module" src="assets/js/main.js"></script>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="brand">
      <h1>台股研究台</h1>
      <nav class="mkt-switch" aria-label="市場">
        <a href="#overview" id="sw-tw">台股</a>
        <a href="#us" id="sw-us">美股</a>
      </nav>
    </div>
    <button id="freshness" class="freshness" type="button" aria-expanded="false" aria-controls="sources">載入資料中…</button>
  </header>
  <div id="sources" class="sources" hidden></div>
  <div id="banners"></div>

  <div class="search" role="search">
    <label for="search" class="sr-only">搜尋股票代號或名稱</label>
    <input id="search" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search"
           role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="results"
           placeholder="輸入代號或名稱，例如 2330、台積">
    <kbd aria-hidden="true">/</kbd>
    <ul id="results" class="results" role="listbox" aria-label="搜尋結果" hidden></ul>
  </div>

  <nav id="watchlist" class="strip" aria-label="追蹤清單"></nav>
  <nav id="us-watchlist" class="strip" aria-label="美股追蹤清單"></nav>
  <div id="macro" class="strip macro" aria-label="總經指標"></div>

  <main id="stock" class="stock" aria-live="polite"></main>

  <footer class="foot">
    資料來源：臺灣證券交易所、證券櫃檯買賣中心 OpenAPI，FinMind，Yahoo Finance，美國證管會 SEC EDGAR；AI 報告由 Google Gemini / Anthropic Claude 產生。僅供研究參考，非投資建議。
  </footer>
</div>

<dialog id="prompt-dialog" aria-labelledby="prompt-title">
  <header>
    <h2 id="prompt-title">分析指令</h2>
    <button id="prompt-close" class="btn" type="button">關閉</button>
  </header>
  <label for="prompt-text" class="sr-only">分析指令內容</label>
  <textarea id="prompt-text" readonly></textarea>
  <footer>
    <button id="prompt-copy" class="btn primary" type="button">複製指令</button>
  </footer>
</dialog>

<dialog id="macro-dialog" class="macro-dialog" aria-labelledby="macro-title">
  <header>
    <h2 id="macro-title">歷史紀錄</h2>
    <button id="macro-close" class="btn" type="button">關閉</button>
  </header>
  <div id="macro-body" class="macro-body"></div>
</dialog>
</body>
</html>
