# Pull Request / 非 main 分支的測試。不使用任何 Secret，也不部署。
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Unit tests (Python + JS)
        run: |
          python -m unittest discover -s tests/py -v
          node --test "tests/js/*.test.mjs"

      - name: End-to-end test (headless Chromium, synthetic data)
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python tests/e2e/test_dashboard.py
