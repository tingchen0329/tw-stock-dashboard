# ─────────────────────────────────────────────────────────────────────
# 更新資料並部署到 GitHub Pages
#
# FinMind token 的安全流向：
#   GitHub Secrets (FINMIND_TOKEN)
#     → 只在「Fetch data」這一步以環境變數提供給 Python
#     → Python 把 token 放在 HTTP header 呼叫 FinMind
#     → 輸出不含 token 的 JSON（腳本最後會掃描確認，發現 token 就中止）
#     → 部署靜態網站
#   網頁瀏覽器永遠拿不到 token。
#
# 一次性設定（見 docs/SETUP.md）：
#   1. Settings → Secrets and variables → Actions → New repository secret
#      Name: FINMIND_TOKEN   Value: 你的 FinMind token
#   2. Settings → Pages → Build and deployment → Source: GitHub Actions
# ─────────────────────────────────────────────────────────────────────
name: Update data & deploy

on:
  push:
    branches: [main]
  # 主要排程：外部免費排程服務（cron-job.org）準時呼叫 workflow_dispatch，設定見 docs/SCHEDULER.md
  #   GitHub 內建排程在尖峰時常延遲數小時甚至略過（2026-10 實測：盤中一次都沒跑、收盤後延遲 6–7 小時）
  workflow_dispatch:
    inputs:
      mode:
        description: "smart：依時間自動判斷（排程用）｜auto：行情與總經，個股只抓新加入的｜full：個股全部重抓（約 510 次 FinMind 請求）｜macro：只更新總經"
        type: choice
        options: [smart, auto, full, macro]
        default: smart
  schedule:
    # 備援：外部排程失效（例如存取權杖過期）時，至少每天還有完整更新。mode 為 smart，延遲或重複觸發都不會多花額度
    - cron: "37 11 * * 1-5"   # 台北 19:37
    - cron: "17 21 * * 1-5"   # 台北 05:17（週二至週六）

permissions:
  contents: read              # 只讀程式碼；資料不 commit 回 repo，歷史紀錄保持乾淨
  pages: write
  id-token: write

concurrency:                  # 同時只跑一個部署，避免舊資料覆蓋新資料
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # 固定版本：ubuntu-latest 正在換成 Ubuntu 26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Unit tests
        run: |
          python -m unittest discover -s tests/py
          node --test "tests/js/*.test.mjs"

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r index.html assets _site/
          touch _site/.nojekyll

      - name: Fetch data (FinMind token from Secrets)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}   # SEC EDGAR 要求 User-Agent 含聯絡方式（見 docs/SETUP.md）
          # 更新模式（FinMind 免費額度每小時 600 次，追蹤清單 68 檔完整抓一次約 510 次）：
          #   smart 排程用（外部排程與備援排程）：依時間與上次完整更新自動選擇下面三種
          #         交易日 16:15、19:30 後尚未完整更新 → full；21:00–08:30 → macro；其他 → auto
          #   full  個股資料全部重抓（FinMind 個股資料本來就只在收盤後更新）
          #   auto  push 預設：行情、盤中價、總經；個股只抓網站上還沒有的
          #   macro 只更新總經（台指期夜盤、美股）
          # 都會先取回網站上目前的資料；取不到時自動改成 full。額度用完時，沒抓到的個股沿用上一份
          MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'smart') || 'auto' }}
        run: |
          python scripts/fetch_data.py --out _site/data --mode "$MODE" \
            --base-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: Build overview table
        run: node scripts/build_overview.mjs _site/data

      - name: Annotate failed sources
        if: always()
        # 失敗的資料源以 warning 註記顯示在執行頁面上方（也可由 API 讀取，方便遠端檢查）
        run: |
          python - <<'EOF'
          import json, pathlib
          p = pathlib.Path("_site/data/meta.json")
          if p.exists():
              m = json.loads(p.read_text())
              bad = [f"{k}: {s.get('note', '')}" for k, s in m["sources"].items() if not s["ok"]]
              ok = len(m["sources"]) - len(bad)
              wl = m["sources"].get("finmind_watchlist", {}).get("note", "")
              if m.get("mode") == "macro":
                  print(f"::notice title=只更新總經 {m['macroAt']}::個股資料沿用 {m['generatedAt']}，{ok}/{len(m['sources'])} 個來源正常，FinMind 請求 {m['macroFinmindRequests']} 次")
              else:
                  print(f"::notice title=資料更新（{m.get('mode', 'full')}）{m['generatedAt']}::{ok}/{len(m['sources'])} 個來源正常，FinMind 請求 {m['finmindRequests']} 次。追蹤清單 {len(m['watchlist'])} 檔：{wl}")
              for b in bad:
                  print(f"::warning title=資料來源失敗::{b}")
              us = m["sources"].get("us_prices")
              if us:
                  fin = m["sources"].get("us_financials", {})
                  print(f"::notice title=美股 {len(m.get('usWatchlist', []))} 檔::股價 {us['rows']} 檔、SEC 財報 {fin.get('rows', 0)} 檔{('；' + fin['note']) if fin.get('note') else ''}")
              sp = pathlib.Path("_site/data/screen.json")
              if sp.exists():
                  sc = json.loads(sp.read_text())
                  rows = [dict(zip(sc["cols"], r)) for r in sc["rows"]]
                  cnt = lambda mk, k: sum(1 for r in rows if r["market"] == mk and r[k] is not None)
                  notes = "；".join(f"{k} {m['sources'][k].get('note')}" for k in ("twse_revenue", "tpex_revenue", "twse_income", "tpex_income")
                                   if m["sources"].get(k, {}).get("note"))
                  print(f"::notice title=選股資料 {len(rows)} 檔::月營收 {sc['asOf'].get('revenue')}（上市 {cnt('twse', 'revYoY')}、上櫃 {cnt('tpex', 'revYoY')} 檔），"
                        f"財報 {sc['asOf'].get('income')}（上市 {cnt('twse', 'eps')}、上櫃 {cnt('tpex', 'eps')} 檔）{('；' + notes) if notes else ''}")
          EOF

      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("_site/data/meta.json")
          if not p.exists():
              print("## 資料抓取失敗：沒有產生 meta.json"); raise SystemExit
          m = json.loads(p.read_text())
          if m.get("mode") == "macro":
              print(f"## 只更新總經 {m['macroAt']}（個股資料沿用 {m['generatedAt']}，本次 FinMind 請求 {m['macroFinmindRequests']} 次）")
          print(f"## 資料更新 {m['generatedAt']}（模式：{m.get('mode', 'full')}）")
          print(f"FinMind token：{'已使用' if m['tokenUsed'] else '未設定（匿名額度）'}，請求數 {m['finmindRequests']}\n")
          print("| 來源 | 狀態 | 筆數 | 耗時 | 備註 |\n|---|---|---|---|---|")
          for k, s in m["sources"].items():
              print(f"| {k} | {'✅' if s['ok'] else '❌'} | {s['rows']} | {s['ms']} ms | {s.get('note','')} |")
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04   # 固定版本：ubuntu-latest 正在換成 Ubuntu 26
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
